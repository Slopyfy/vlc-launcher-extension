
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VLC Launcher</title>
  <style>
    body { width: 420px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; }
    h3 { margin-top: 0; margin-bottom: 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
    .url { font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; }
    .btn { background: #FF6600; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; flex-shrink: 0; white-space: nowrap; font-weight: 500; }
    .btn:hover { background: #E55D00; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn.refresh { background: #2196F3; font-size: 11px; margin-bottom: 10px; padding: 3px 8px; }
    .btn.refresh:hover { background: #1976D2; }
    .options { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 12px; flex-wrap: wrap; }
    .options label { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
    .options input[type="checkbox"] { margin: 0; cursor: pointer; }
    .quality { font-size: 10px; color: #666; background: #e8e8e8; padding: 2px 5px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
    .fmtSelect { font-size: 11px; padding: 2px 4px; border: 1px solid #ccc; border-radius: 4px; background: #fff; max-width: 110px; flex-shrink: 0; cursor: pointer; }
    .status { font-size: 12px; color: #555; margin-top: 10px; word-break: break-all; }
    .manual { display: flex; gap: 6px; margin-top: 8px; }
    .manual input { flex: 1; padding: 5px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .btn.copy { background: #888; padding: 3px 6px; font-size: 11px; }
    .btn.copy:hover { background: #666; }
    .btn.small { padding: 2px 6px; font-size: 11px; }
    .kbd { font-size: 10px; color: #999; margin-top: 4px; }
    hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    details { margin-top: 8px; font-size: 12px; }
    details summary { cursor: pointer; color: #666; font-weight: 500; }
    #historyList { max-height: 120px; overflow-y: auto; margin-top: 6px; }
    #historyList li { margin-bottom: 4px; }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #ddd; }
      .quality { background: #333; color: #aaa; }
      .status { color: #aaa; }
      .manual input { background: #2d2d2d; color: #ddd; border-color: #555; }
      .fmtSelect { background: #2d2d2d; color: #ddd; border-color: #555; }
      .btn.copy { background: #555; } .btn.copy:hover { background: #444; }
      .btn:disabled { background: #444; color: #888; }
      hr { border-top-color: #333; }
      .kbd { color: #777; }
    }
  </style>
</head>
<body>
  <h3>Detected Streams</h3>
  <button id="refreshBtn" class="btn refresh" title="Clear and rescan">↻ Refresh</button>
  
  <div class="options">
    <label><input type="checkbox" id="alwaysOnTop"> Always on Top</label>
    <label><input type="checkbox" id="fullscreen"> Fullscreen</label>
    <label><input type="checkbox" id="loop"> Loop</label>
    <label>Speed
      <select id="speed" style="font-size:11px">
        <option value="">1x</option>
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </label>
  </div>

  <div id="streamList">
    <p style="color:#888">Listening for streams…</p>
  </div>

  <hr>

  <div class="manual">
    <input type="text" id="manualUrl" placeholder="Or paste a stream URL...">
    <button id="manualLaunch" class="btn">Launch</button>
  </div>

  <details>
    <summary>History</summary>
    <div id="historyList"><p style="color:#888">No history yet</p></div>
  </details>

  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
